name: isr-scraper

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-8.13.4}
    container_name: isr-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms1g -Xmx1g}
      - cluster.name=isr-es
      - node.name=isr-es-node
      - bootstrap.memory_lock=true
      - action.destructive_requires_name=true
      - ingest.geoip.downloader.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - es_logs:/usr/share/elasticsearch/logs
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -sf http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  mongodb:
    image: mongo:${MONGO_VERSION:-6.0}
    container_name: isr-mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-isr}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-isr_dev_pw}
      - MONGO_INITDB_DATABASE=${MONGO_DB:-isr}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  tika:
    image: apache/tika:${TIKA_VERSION:-2.9.2.1-full}
    container_name: isr-tika
    ports:
      - "${TIKA_PORT:-9998}:9998"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9998/tika"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  es_data:
  es_logs:
  mongo_data:
  mongo_config:
