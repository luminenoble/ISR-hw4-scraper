[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# 项目只用 pyproject 管理依赖；源码通过 cwd / sys.path 引用，不需要打包
py-modules = []

[project]
name = "isr-scraper"
version = "0.1.0"
description = "面向小说同人创作的角色背景垂直搜索引擎（ISR 课程作业）"
readme = "design.md"
requires-python = ">=3.11"
authors = [{ name = "ISR Course Team", email = "isr-course@example.com" }]

dependencies = [
  "scrapy>=2.13,<3.0",
  "pymongo>=4.6,<5.0",
  "loguru>=0.7",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "python-dotenv>=1.0",
  "itemadapter>=0.8",
  "httpx>=0.27",
  "tqdm>=4.66",
  "elasticsearch>=8.13,<9.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "argon2-cffi>=23.1",
  "PyJWT>=2.8",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.4",
  "black>=24.0",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "types-beautifulsoup4",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-v",
  "--tb=short",
  "--junitxml=reports/junit.xml",
  "--cov=crawler/isr_crawler",
  "--cov-report=term-missing",
  "--cov-report=html:reports/htmlcov",
  "--cov-report=xml:reports/coverage.xml",
]

[tool.coverage.run]
branch = true
source = ["crawler/isr_crawler"]

[tool.coverage.report]
show_missing = true
skip_empty = true
